{% set data = load_setup_py_data() %}

package:
  name: ts-m1m3-cli
  version: {{ data.get('version') }}

source:
  path: ../

build:
  noarch: python
  script: {{PYTHON}} -m pip install --no-deps --ignore-installed .
  entry_points:
    - correlate-timeseries = lsst.ts.m1m3.cli.correlate_timeseries:run
    - compare-two-tma-settings = lsst.ts.m1m3.cli.compare_forces_two_tmasettings:run
    - find-changes = lsst.ts.m1m3.cli.find_changes:run
    - m1m3-aav = lsst.ts.m1m3.cli.acceleration_and_velocity:run
    - m1m3-do-bump-tests = lsst.ts.m1m3.cli.m1m3_do_bump_tests:run
    - m1m3-bump-tests-times = lsst.ts.m1m3.cli.m1m3_bump_tests_times:run
    - m1m3-fcu-stats = lsst.ts.m1m3.cli.fcu_stats:run
    - m1m3-fe-outliers = lsst.ts.m1m3.cli.m1m3_fe_outliers:run

test:
  requires:
    - pytest
    - vcrpy
    - ts-conda-build =0.5
  source_files:
    - python
    - tests
  commands:
    - pytest

requirements:
  host:
    - python {{python}
    - setuptools >={{setuptools}}
    - setuptools_scm ={{setuptools_scm}}
  run:
    - python {{python}}
    - astropy
    - matplotlib
    - numpy
    - pandas
    - scipy
    - sty
    - tqdm
    - ts-xml
    - lsst-efd-client
    - ts-salobj
    - ts-m1m3-utils
