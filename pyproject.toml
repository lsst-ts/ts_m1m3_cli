[build-system]
requires = [ "setuptools", "setuptools_scm" ]
build-backend = "setuptools.build_meta"

[project]
name = "ts-m1m3-cli"
description = "LSST M1M3 Command Line tools."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
urls = { documentation = "https://ts-m1m3-cli.lsst.io", repository = "https://github.com/lsst-ts/ts_m1m3_cli" }
dynamic = [ "version" ]
dependencies = [
  "astropy",
  "matplotlib",
  "numpy",
  "pandas",
  "scipy",
  "sty",
  "tqdm",
  "ts_m1m3_utils",
  "ts_salobj",
  "ts_xml",
  "lsst_efd_client",
]

[project.scripts]
correlate-timeseries = "lsst.ts.m1m3.cli.correlate_timeseries:run"
compare-two-tma-settings = "lsst.ts.m1m3.cli.compare_forces_two_tmasettings:run"
find-changes = "lsst.ts.m1m3.cli.find_changes:run"
m1m3-aav = "lsst.ts.m1m3.cli.acceleration_and_velocity:run"
m1m3-bump-tests-times = "lsst.ts.m1m3.cli.m1m3_bump_tests_times:run"
m1m3-do-bump-tests = "lsst.ts.m1m3.cli.m1m3_do_bump_tests:run"
m1m3-fcu-stats = "lsst.ts.m1m3.cli.m1m3_fcu_stats:run"
m1m3-fe-outliers = "lsst.ts.m1m3.cli.m1m3_fe_outliers:run"
m1m3-find-hp-excess = "lsst.ts.m1m3.cli.m1m3_find_hp_excess:run"

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[tool.setuptools_scm]
write_to = "python/lsst/ts/m1m3/cli/version.py"
write_to_template = """
# Generated by setuptools_scm
__all__ = ["__version__"]
__version__ = "{version}"
"""

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = ["documenteer[pipelines]"]
